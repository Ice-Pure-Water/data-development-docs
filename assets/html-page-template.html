<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{PAGE_TITLE}}</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f3f6fa;
      --surface: #fff;
      --ink: #17243a;
      --body: #344a63;
      --muted: #566a82;
      --soft: #71839a;
      --line: #d6dfe9;
      --blue: #315fe8;
      --blue-soft: #e9efff;
      --teal: #148f8a;
      --purple: #7856bd;
      --amber: #a96b12;
      --focus: #80a4ff;
      --top-height: 64px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: calc(var(--top-height) + 12px); }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--page);
      font: 16px/1.65 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    }
    a { color: #2854cb; text-underline-offset: 3px; }
    a:focus-visible, button:focus-visible, summary:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }
    code { overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .skip-link {
      position: absolute; left: -10000px; top: 8px; z-index: 20;
      padding: 8px 12px; background: var(--surface);
    }
    .skip-link:focus { left: 12px; }
    .topbar {
      position: sticky; top: 0; z-index: 10; height: var(--top-height);
      border-bottom: 1px solid var(--line); background: rgb(255 255 255 / 96%);
      backdrop-filter: blur(10px);
    }
    .topbar-inner, .page {
      width: min(100%, 2100px); min-width: 1500px; margin-inline: auto;
      padding-inline: 36px;
    }
    .topbar-inner { height: 100%; display: flex; align-items: center; gap: 28px; }
    .brand { color: var(--ink); font-weight: 700; text-decoration: none; white-space: nowrap; }
    .topnav { display: flex; gap: 22px; margin-left: auto; white-space: nowrap; }
    .topnav a { color: var(--muted); font-size: 14px; text-decoration: none; }
    .page { padding-top: 32px; padding-bottom: 80px; }
    .intro { max-width: 1100px; margin-bottom: 28px; }
    h1 { margin: 0 0 12px; font-size: 42px; line-height: 1.2; letter-spacing: -.025em; }
    .summary { max-width: 76ch; margin: 0; color: var(--body); font-size: 18px; }
    .source-links { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 16px; font-size: 14px; }
    .journey { position: relative; }
    .journey-sticky {
      position: sticky; top: calc(var(--top-height) + 8px); z-index: 2;
      display: grid; grid-template-columns: 210px minmax(720px, 1fr) 390px;
      gap: 20px; height: calc(100vh - var(--top-height) - 16px); min-height: 620px;
      background: var(--page);
    }
    .stage-nav { align-self: start; border-left: 2px solid var(--line); padding-left: 16px; }
    .stage-nav a {
      display: block; margin: 0 0 6px; padding: 12px 12px 12px 14px;
      color: var(--muted); font-size: 15px; line-height: 1.45; text-decoration: none;
    }
    .stage-nav a[aria-current="step"] {
      border-left: 4px solid var(--blue); margin-left: -18px;
      color: var(--blue); background: var(--blue-soft); font-weight: 700;
    }
    .flow-panel, .phase-panel { min-width: 0; background: var(--surface); }
    .flow-panel { overflow: hidden; }
    .phase-panel { overflow-x: hidden; overflow-y: auto; }
    .flow-panel { padding: 20px; }
    .flow-panel h2, .section h2 { margin: 0; font-size: 24px; line-height: 1.3; }
    .flow-canvas { margin-top: 14px; }
    .flow-canvas svg { display: block; width: 100%; height: auto; }
    .flow-canvas [data-stage-band] { fill: transparent; transition: fill .25s ease; }
    .flow-canvas [data-stage-band].active { fill: var(--blue-soft); }
    .flow-canvas [data-stage-node].active { filter: drop-shadow(0 0 5px rgb(49 95 232 / 42%)); }
    .flow-canvas [data-stage-node]:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
    .flow-caption { margin: 12px 0 0; color: var(--muted); font-size: 14px; }
    .phase-panel { padding: 22px 24px; }
    .phase-detail h2 { margin: 0 0 12px; font-size: 23px; line-height: 1.3; }
    .phase-detail h3 { margin: 20px 0 8px; font-size: 18px; }
    .phase-detail p, .phase-detail li { color: var(--body); font-size: 16px; }
    .phase-detail p { margin: 9px 0; }
    .phase-detail ul, .phase-detail ol { padding-left: 22px; }
    .phase-objects { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
    .phase-detail { display: block; }
    .has-js .phase-detail:not([data-active="true"]) { display: none; }
    .stage-markers { position: relative; z-index: 0; }
    .stage-marker { height: 72vh; min-height: 520px; scroll-margin-top: calc(var(--top-height) + 12px); }
    .content-section { margin-top: 58px; scroll-margin-top: calc(var(--top-height) + 16px); }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    .section-head p { max-width: 62ch; margin: 0; color: var(--muted); font-size: 15px; }
    .logic-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 40px; }
    .logic-item { min-width: 0; padding: 16px 0; border-bottom: 1px solid var(--line); }
    .logic-item summary { cursor: pointer; font-size: 17px; font-weight: 700; }
    .logic-summary { display: block; margin-top: 5px; color: var(--muted); font-size: 15px; font-weight: 400; }
    .logic-body { padding: 8px 0 0 24px; color: var(--body); font-size: 16px; }
    .object-grid { display: grid; grid-template-columns: minmax(180px, .62fr) repeat(var(--scope-count), minmax(0, 1fr)); border-top: 1px solid var(--line); }
    .object-grid-row { display: grid; grid-template-columns: minmax(180px, .62fr) repeat(var(--scope-count), minmax(0, 1fr)); grid-column: 1 / -1; }
    .object-grid-head { padding: 12px 16px; border-bottom: 1px solid var(--line); background: #eaf0f7; color: var(--ink); font-size: 15px; font-weight: 700; }
    .object-role { margin: 0; padding: 18px 16px; border-bottom: 1px solid var(--line); font-size: 16px; font-weight: 700; }
    .object-cell { min-width: 0; padding: 16px; border-bottom: 1px solid var(--line); color: var(--body); font-size: 15px; }
    .object-cell ul { margin: 0; padding-left: 20px; }
    .object-cell li + li { margin-top: 12px; }
    .object-empty { color: var(--soft); }
    .lineage-wrap { overflow: auto; margin-top: 16px; background: var(--surface); }
    .lineage { width: 100%; border-collapse: collapse; font-size: 15px; line-height: 1.55; }
    .lineage th, .lineage td { min-width: 130px; padding: 12px 14px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    .lineage th { background: #eaf0f7; color: var(--ink); }
    .source-notes { padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
    .footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .flow-canvas [data-stage-band] { transition: none; }
      .flow-canvas svg [data-flow-motion] { animation: none !important; }
    }
    @media print {
      .topbar, .stage-nav, .stage-markers { display: none !important; }
      .journey-sticky { position: static; display: block; height: auto; }
      .phase-detail { display: block !important; break-inside: avoid; }
      .flow-panel, .phase-panel { overflow: visible; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="topbar" id="top">
    <div class="topbar-inner">
      <a class="brand" href="#top">{{PAGE_TITLE}}</a>
      <nav class="topnav" aria-label="页面导航"><!-- NAV_LINKS --></nav>
    </div>
  </header>
  <main class="page" id="main">
    <header class="intro">
      <h1>{{PAGE_TITLE}}</h1>
      <p class="summary">{{BUSINESS_SUMMARY}}</p>
      <nav class="source-links" aria-label="需求与参考来源"><!-- SOURCE_LINKS --></nav>
    </header>
    <section class="journey" id="journey" aria-label="整体数据流程与阶段详情">
      <div class="journey-sticky">
        <nav class="stage-nav" aria-label="处理阶段"><!-- STAGE_LINKS --></nav>
        <section class="flow-panel" aria-label="整体数据流程">
          <h2>整体数据流程</h2>
          <div class="flow-canvas"><!-- FLOW_SVG --></div>
          <p class="flow-caption">{{FLOW_CAPTION}}</p>
        </section>
        <aside class="phase-panel" aria-live="polite"><!-- PHASE_DETAILS --></aside>
      </div>
      <div class="stage-markers" aria-hidden="true"><!-- STAGE_MARKERS --></div>
    </section>
    <section class="content-section" id="logic">
      <header class="section-head"><h2>关键业务逻辑</h2><p>{{LOGIC_INTRO}}</p></header>
      <div class="logic-grid"><!-- LOGIC_ITEMS --></div>
    </section>
    <section class="content-section" id="objects">
      <header class="section-head"><h2>数据对象</h2><p>按对象作用分行、按适用范围分列；完整展示库、表、用途及已知结构信息。</p></header>
      <div class="object-grid" role="table" aria-label="数据对象清单" style="--scope-count: {{SCOPE_COUNT}}">
        <!-- OBJECT_GRID_ROWS: replace with role=row containers; first row has a rowheader and scope columnheaders, then each role row has a rowheader and one cell per scope. -->
      </div>
    </section>
    <section class="content-section" id="lineage">
      <header class="section-head"><h2>字段血缘</h2><p>{{LINEAGE_INTRO}}</p></header>
      <div class="lineage-wrap"><!-- LINEAGE_TABLE --></div>
    </section>
    <section class="content-section" id="source-notes"><!-- SOURCE_NOTES --></section>
    <footer class="footer">规格内容以对应 Markdown 为事实基线。</footer>
  </main>
  <script>
    document.documentElement.classList.add('has-js');
    const stageLinks = [...document.querySelectorAll('[data-stage-link]')];
    const phaseDetails = [...document.querySelectorAll('[data-stage-detail]')];
    const flowNodes = [...document.querySelectorAll('[data-stage-node]')];
    const stageBands = [...document.querySelectorAll('[data-stage-band]')];
    const stageMarkers = [...document.querySelectorAll('[data-stage-marker]')];
    function activateStage(id) {
      stageLinks.forEach(link => {
        const active = link.dataset.stageLink === id;
        if (active) link.setAttribute('aria-current', 'step');
        else link.removeAttribute('aria-current');
      });
      phaseDetails.forEach(detail => detail.dataset.active = String(detail.dataset.stageDetail === id));
      flowNodes.forEach(node => node.classList.toggle('active', node.dataset.stageNode === id));
      stageBands.forEach(band => band.classList.toggle('active', band.dataset.stageBand === id));
    }
    stageLinks.forEach(link => link.addEventListener('click', event => {
      event.preventDefault();
      const marker = document.querySelector(`[data-stage-marker="${CSS.escape(link.dataset.stageLink)}"]`);
      marker?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      activateStage(link.dataset.stageLink);
    }));
    flowNodes.forEach(node => node.addEventListener('click', () => activateStage(node.dataset.stageNode)));
    flowNodes.forEach(node => node.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        activateStage(node.dataset.stageNode);
      }
    }));
    if ('IntersectionObserver' in window) {
      const observer = new IntersectionObserver(entries => {
        const visible = entries.filter(entry => entry.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
        if (visible) activateStage(visible.target.dataset.stageMarker);
      }, { rootMargin: '-38% 0px -48% 0px', threshold: [0, .2, .5] });
      stageMarkers.forEach(marker => observer.observe(marker));
    }
    if (stageMarkers.length) activateStage(stageMarkers[0].dataset.stageMarker);
  </script>
</body>
</html>
